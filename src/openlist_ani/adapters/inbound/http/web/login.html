<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · op-ani</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260824-mikan-link-1">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand"><span class="brand-mark">▶</span><div><strong>op-ani</strong><small>自托管追番工具</small></div></div>
    <div class="login-heading">
      <span class="eyebrow">WELCOME BACK</span>
      <h1>登录 op-ani</h1>
      <p class="muted">登录后管理追番订阅、下载任务和运行日志。</p>
    </div>
    <form id="loginForm" class="stack-form">
      <label class="login-field" for="username"><span>用户名</span><input id="username" name="username" autocomplete="username" required></label>
      <label class="login-field" for="password"><span>密码</span><input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary-button login-button" id="loginButton" type="submit"><span>进入追番中心</span><b>→</b></button>
      <p class="form-error" id="loginError" role="alert"></p>
    </form>
    <p class="login-footnote">仅限授权用户访问</p>
  </main>
  <script type="module">
    const form = document.querySelector('#loginForm');
    const button = document.querySelector('#loginButton');
    const error = document.querySelector('#loginError');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            username: document.querySelector('#username').value.trim(),
            password: document.querySelector('#password').value,
          }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || '登录失败');
        location.href = '/';
      } catch (err) {
        error.textContent = err.message || '登录失败';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
