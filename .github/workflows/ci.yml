name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - rust
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: CI / Lint
    if: github.ref_name != 'rust' && github.base_ref != 'rust'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.11

      - name: Check lockfile
        run: uv lock --check

      - name: Run Ruff
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen black --check .

  test:
    name: CI / Test
    if: github.ref_name != 'rust' && github.base_ref != 'rust'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.11

      - name: Run tests
        run: uv run --frozen pytest -q

  rust:
    name: Rust / Format, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust 1.85 toolchain
        run: rustup toolchain install 1.85 --profile minimal --component rustfmt --component clippy

      - name: Check deployment helpers
        run: |
          python -m venv /tmp/openlist-ani-deploy-lint
          /tmp/openlist-ani-deploy-lint/bin/pip install black==26.3.1 ruff==0.15.0
          /tmp/openlist-ani-deploy-lint/bin/black --target-version py311 --check rust/deploy
          /tmp/openlist-ani-deploy-lint/bin/ruff check rust/deploy
          for script in rust/deploy/*.sh; do sh -n "$script"; done

      - name: Check formatting
        working-directory: rust
        run: cargo +1.85 fmt --all -- --check

      - name: Run Rust tests
        working-directory: rust
        run: cargo +1.85 test --locked

      - name: Run Clippy
        working-directory: rust
        run: cargo +1.85 clippy --locked --all-targets -- -D warnings

      - name: Build Linux release
        working-directory: rust
        run: cargo +1.85 build --locked --release

  build:
    name: CI / Build
    if: github.ref_name != 'rust' && github.base_ref != 'rust'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.11

      - name: Build package
        run: uv build --out-dir dist

      - name: Build Docker image
        run: docker build --file docker/Dockerfile --tag openlist-ani:ci .
